project:
  name: "inside_the_multilingual_transformer"
  seed: 1337
  output_root: "outputs"

paths:
  prior_repo_candidates:
    - "../language_neutral_or_language_specific_disentangling_multilingual_llm_subspaces_with_naturalistic_fmri"
    - "../*language_neutral*"
  data_root: "data"
  raw_root: "data/raw"
  derivatives_root: "data/derivatives"
  annotations_root: "data/annotations"
  manifests_root: "data/manifests"

dataset:
  openneuro_accession: "ds003643"
  prefer_prior_repo_version: true
  require_derivatives: true
  languages: ["EN", "FR", "ZH"]
  canonical_runs: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  tr_seconds: 2.0

models:
  xlmr:
    hf_id: "xlm-roberta-base"
    type: "encoder"
    hidden_size: 768
    state_names: ["INPUT", "ATTN", "POST_ATTN", "FFN", "OUTPUT"]
  nllb:
    hf_id: "facebook/nllb-200-distilled-600M"
    type: "encoder_only"
    hidden_size: 1024
    state_names: ["INPUT", "ATTN", "POST_ATTN", "FFN", "OUTPUT"]

features:
  fine_hz: 10.0
  pooling: "mean"
  normalize: "l2"
  eps: 1.0e-8
  cache_format: "zarr"
  cache_dtype: "float32"
  conditions_main: ["SHARED", "SPECIFIC"]
  conditions_controls:
    - "RAW"
    - "MISMATCHED_SHARED"
    - "ACOUSTIC_ONLY"

encoding:
  outer_cv: "leave_one_run_out"
  inner_cv: "leave_one_run_out"
  alpha_grid:
    - 1.0e-2
    - 3.1622776601683795e-2
    - 1.0e-1
    - 3.1622776601683795e-1
    - 1.0
    - 3.1622776601683795
    - 10.0
    - 31.622776601683793
    - 100.0
    - 316.22776601683796
    - 1000.0
    - 3162.2776601683795
    - 10000.0
    - 100000.0
    - 1000000.0
  max_pcs: 128
  variance_threshold: 0.95
  primary_score: "mean_outer_fold_fisher_z"

stats:
  permutations: 10000
  bootstraps: 10000
  primary_correction: "holm"
  secondary_correction: "bh_fdr"

attribution:
  tokenizer_backend: "stanza"
  use_word_level: true
  rep_state_selection_metric: "max_mean_shared_minus_specific"
  deletion_ks: [1, 2, 3]
  matched_random_draws: 100
  local_window_start_offset_sec: 2.0
  local_window_end_offset_sec: 12.0

plots:
  export_png: true
  export_pdf: true
  dpi: 300
